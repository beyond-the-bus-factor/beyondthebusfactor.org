<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ site.logo | relative_url }}" alt="" width="34" height="34">
      <span class="brand-text">
        <span class="brand-name">Beyond the Bus Factor</span>
      </span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menu">
    <label for="nav-toggle" class="nav-button">
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </label>
    <fieldset class="theme-switch" hidden>
      <legend class="visually-hidden">Colour theme</legend>
      <input type="radio" name="theme" id="theme-light" value="light">
      <label for="theme-light" title="Light">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <span class="visually-hidden">Light</span>
      </label>
      <input type="radio" name="theme" id="theme-auto" value="auto" checked>
      <label for="theme-auto" title="Match my system">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 20.5h7M12 17v3.5"/></svg>
        <span class="visually-hidden">Match my system</span>
      </label>
      <input type="radio" name="theme" id="theme-dark" value="dark">
      <label for="theme-dark" title="Dark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/></svg>
        <span class="visually-hidden">Dark</span>
      </label>
    </fieldset>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.navigation.main %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<script>
  (function () {
    var box = document.querySelector('.theme-switch');
    if (!box) return;
    var read = function () { try { return localStorage.getItem('theme') || 'auto'; } catch (e) { return 'auto'; } };
    var apply = function (v) {
      if (v === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', v);
    };
    var current = read();
    var chosen = box.querySelector('input[value="' + current + '"]') || box.querySelector('input[value="auto"]');
    chosen.checked = true;
    apply(current);
    box.addEventListener('change', function (e) {
      if (e.target.name !== 'theme') return;
      var v = e.target.value;
      apply(v);
      try { v === 'auto' ? localStorage.removeItem('theme') : localStorage.setItem('theme', v); } catch (err) {}
    });
    /* Only revealed once the script runs, so it is never a dead control. */
    box.hidden = false;
  })();
</script>
