title: "Beyond the Bus Factor"
tagline: "Resilience and succession planning for organisations that depend on people"
description: "Practical, freely licensed tools for finding and reducing key person risk in open source projects, charities, NGOs and companies."
url: "https://beyondthebusfactor.org"
baseurl: ""
lang: en-GB
locale: en_GB

logo: /assets/images/logo.png

author:
  name: "Sīlavāpi Cheesley"
  avatar: /assets/images/silavapi-avatar.png
  bio: "Project Lead, Mautic. Working on sustainable open source and organisational resilience."

repo_resources: "https://github.com/beyond-the-bus-factor/resilience-resources"
repo_site: "https://github.com/beyond-the-bus-factor/beyondthebusfactor.org"
org_url: "https://github.com/beyond-the-bus-factor"
contact_form: "https://formspree.io/f/xzzkpdrd"

social:
  - label: "GitHub"
    url: "https://github.com/beyond-the-bus-factor"
  - label: "LinkedIn"
    url: "https://linkedin.com/in/ruthcheesley"

permalink: /updates/:title/

collections:
  sessions:
    output: true
    permalink: /sessions/:path/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  # Assets carry front matter only so Jekyll will process them.
  # Without this they inherit the page layout and come out as HTML.
  - scope: { path: "assets" }
    values: { layout: null }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: sessions }
    values: { layout: session }

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - .ruby-version

sass:
  style: compressed

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
