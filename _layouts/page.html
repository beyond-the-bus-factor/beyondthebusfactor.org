---
layout: default
---
<article class="page">
  <div class="wrap narrow">
    <header class="page-head">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.standfirst %}<p class="standfirst">{{ page.standfirst }}</p>{% endif %}
    </header>
    <div class="prose">{{ content }}</div>
  </div>
</article>
