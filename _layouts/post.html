---
layout: default
---
<article class="page">
  <div class="wrap narrow">
    <header class="page-head">
      <p class="eyebrow"><a href="{{ '/updates/' | relative_url }}">Updates</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
      <h1>{{ page.title }}</h1>
      {% if page.excerpt %}<p class="standfirst">{{ page.excerpt | strip_html | strip_newlines }}</p>{% endif %}
    </header>
    <div class="prose">{{ content }}</div>
    <p class="back"><a href="{{ '/updates/' | relative_url }}">All updates</a></p>
  </div>
</article>
