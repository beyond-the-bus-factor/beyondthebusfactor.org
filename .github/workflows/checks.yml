name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  house-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that the checker works
        run: python3 script/test-check-house-style.py
      - name: Check house style
        run: python3 script/check-house-style.py

  pa11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Build and serve the site
        run: |
          bundle exec jekyll build
          npx --yes http-server _site -p 4010 -a 127.0.0.1 --silent &
          npx --yes wait-on http://127.0.0.1:4010/ -t 60000
      - name: Check accessibility
        run: npm run a11y
